<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rukshatt Venai — Digital Card</title>
  
  <style>
    :root {
      --bg-surface: #f7f5f0;
      --card-bg: #fdfcf9;
      --card-border: rgba(0, 0, 0, 0.06);
      
      --text-primary: #191c1e;
      --text-secondary: #4a5056;
      --text-muted: #7d848c;

      --row-bg: #ffffff;
      --row-border: rgba(0, 0, 0, 0.07);
      --row-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      --row-shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.08);

      --pill-bg: #16181b;
      --pill-text: #ffffff;
      --pill-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-surface);
      background-image: 
        radial-gradient(at 50% 0%, #ffffff 0px, transparent 75%),
        radial-gradient(at 50% 100%, #eeebe2 0px, transparent 80%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* RVR EMBOSSED SEAL */
    .seal-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ebe7dc 100%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.9),
        inset 0 -2px 4px rgba(0, 0, 0, 0.08),
        0 8px 18px rgba(0, 0, 0, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .seal-ring {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.09);
    }

    .seal-monogram {
      font-family: "Didot", "Playfair Display", "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #2b2e34;
      text-shadow: 
        1px 1px 1px rgba(255, 255, 255, 0.9),
        -1px -1px 1px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 2;
    }

    /* TYPOGRAPHY */
    .name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
      text-align: center;
    }

    .company {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .role {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 1.4rem;
      text-align: center;
    }

    /* SAVE CONTACT PILL */
    .btn-save {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--pill-bg);
      color: var(--pill-text);
      text-decoration: none;
      padding: 0.75rem 1.6rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      box-shadow: var(--pill-shadow);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.15s ease, background-color 0.2s ease;
      margin-bottom: 1.75rem;
    }

    .btn-save:active {
      transform: scale(0.97);
      background-color: #050607;
    }

    .btn-save svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* LINEAR ACTION CARDS */
    .actions-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.15rem;
      background: var(--row-bg);
      border: 1px solid var(--row-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--row-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .action-row:hover, .action-row:active {
      transform: translateY(-1px);
      box-shadow: var(--row-shadow-hover);
      border-color: rgba(0, 0, 0, 0.14);
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .action-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-text {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .action-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .action-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .action-arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* FOOTER */
    .footer {
      margin-top: 2rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Understated RVR Medallion -->
    <div class="seal-wrapper">
      <div class="seal-ring"></div>
      <div class="seal-monogram">RVR</div>
    </div>

    <!-- Identity -->
    <h1 class="name">Rukshatt Venai</h1>
    <div class="company">Boost</div>
    <div class="role">Commercial Strategy & Payments</div>

    <!-- Black Pill Save CTA -->
    <a id="save-vcard-btn" class="btn-save" href="#" download="Rukshatt_Venai.vcf">
      <span>Save Contact</span>
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    </a>

    <!-- Full-Width Linear Action Cards -->
    <div class="actions-list">
      
      <!-- Mobile Phone -->
      <a class="action-row" href="tel:+60182804899">
        <div class="action-left">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          </div>
          <div class="action-text">
            <span class="action-title">Mobile</span>
            <span class="action-detail">+60 18-280 4899</span>
          </div>
        </div>
        <span class="action-arrow">›</span>
      </a>

      <!-- WhatsApp Direct -->
      <a class="action-row" href="https://wa.me/60182804899?text=Hi%20Rukshatt,%20connecting%20via%20your%20digital%20card." target="_blank" rel="noopener">
        <div class="action-left">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          </div>
          <div class="action-text">
            <span class="action-title">WhatsApp</span>
          </div>
        </div>
        <span class="action-arrow">›</span>
      </a>

      <!-- Work Email -->
      <a class="action-row" href="mailto:rukshatt.ravindran@myboost.co">
        <div class="action-left">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>
          <div class="action-text">
            <span class="action-title">Work Email</span>
          </div>
        </div>
        <span class="action-arrow">›</span>
      </a>

      <!-- Personal Email -->
      <a class="action-row" href="mailto:rukshatt.v@outlook.com">
        <div class="action-left">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          </div>
          <div class="action-text">
            <span class="action-title">Personal Email</span>
          </div>
        </div>
        <span class="action-arrow">›</span>
      </a>

      <!-- LinkedIn -->
      <a class="action-row" href="https://www.linkedin.com/in/rravin/" target="_blank" rel="noopener">
        <div class="action-left">
          <div class="action-icon">
            <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
          </div>
          <div class="action-text">
            <span class="action-title">LinkedIn</span>
          </div>
        </div>
        <span class="action-arrow">›</span>
      </a>

    </div>

    <div class="footer">NFC TAP ACTIVE</div>

  </div>

  <script>
    /* Direct vCard Generator */
    const contactData = {
      firstName: "Rukshatt",
      lastName: "Venai",
      company: "Boost",
      title: "Commercial Strategy & Payment Solutions",
      phone: "+60182804899",
      workEmail: "rukshatt.ravindran@myboost.co",
      personalEmail: "rukshatt.v@outlook.com",
      linkedin: "https://www.linkedin.com/in/rravin/"
    };

    const vcardContent = 
`BEGIN:VCARD
VERSION:3.0
N:${contactData.lastName};${contactData.firstName};;;
FN:${contactData.firstName} ${contactData.lastName}
ORG:${contactData.company}
TITLE:${contactData.title}
TEL;TYPE=CELL,VOICE:${contactData.phone}
EMAIL;TYPE=WORK,INTERNET:${contactData.workEmail}
EMAIL;TYPE=HOME,INTERNET:${contactData.personalEmail}
URL:${contactData.linkedin}
END:VCARD`;

    const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
    const downloadLink = document.getElementById('save-vcard-btn');
    downloadLink.href = URL.createObjectURL(blob);
  </script>
</body>
</html>
