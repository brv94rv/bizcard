<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rukshatt Venai — Digital Card</title>
  
  <style>
    /* 🏗️ CONCRETE BRUTALIST & INDUSTRIAL ORANGE PALETTE */
    :root {
      --bg-surface: #d8dbdf;
      --card-bg: #e2e5e9;
      --card-border: rgba(0, 0, 0, 0.08);
      
      --text-primary: #121518;
      --text-secondary: #3b4249;
      --text-muted: #6b737d;

      --row-bg: #ffffff;
      --row-border: rgba(0, 0, 0, 0.08);
      --row-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      --row-shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.09);

      /* Industrial Safety Orange */
      --orange-accent: #ff5500;
      --orange-hover: #e04b00;
      --orange-shadow: 0 6px 20px rgba(255, 85, 0, 0.35);

      /* Machined Gunmetal Seal */
      --seal-base: #2a2e33;
      --seal-metal-light: #454a52;
      --seal-metal-dark: #1e2226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-surface);
      background-image: 
        radial-gradient(at 50% 0%, #eceef1 0px, transparent 75%),
        radial-gradient(at 50% 100%, #caced4 0px, transparent 80%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* MACHINED GUNMETAL RVR SEAL */
    .seal-wrapper {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--seal-metal-light) 0%, var(--seal-metal-dark) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.3),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5),
        0 8px 20px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .seal-ring {
      position: absolute;
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .seal-monogram {
      font-family: "Didot", "Playfair Display", "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #e5e9ee;
      text-shadow: 
        1px 1px 1px rgba(0, 0, 0, 0.8),
        -1px -1px 1px rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 2;
    }

    /* TYPOGRAPHY */
    .name {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
      text-align: center;
    }

    .company {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .role {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 1.4rem;
      text-align: center;
    }

    /* INDUSTRIAL ORANGE PILL CTA */
    .btn-save {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--orange-accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.78rem 1.7rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: var(--orange-shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease, background-color 0.2s ease;
      margin-bottom: 1.75rem;
    }

    .btn-save:active {
      transform: scale(0.97);
      background-color: var(--orange-hover);
    }

    .btn-save svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* CRISP WHITE ACTION CARDS */
    .actions-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.15rem;
      background: var(--row-bg);
      border: 1px solid var(--row-border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-primary);
      box-shadow: var(--row-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .action-row:hover, .action-row:active {
      transform: translateY(-1px);
      box-shadow: var(--row-shadow-hover);
      border-color: rgba(0, 0, 0, 0.16);
    }

    .action-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .action-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .action-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .action-text {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .action-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .action-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .action-arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* FOOTER METADATA */
    .footer-group {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .nfc-tag {
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .brand-subtext {
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      font-weight: 600;
    }
  </style>
</head>
